<!doctype html>
<!--
  Paylaşım bağlantılarının açıldığı sayfa: https://<adres>/?to=title/movie/278
  Android'de uygulamayı açar, uygulama yüklü değilse Google Play'e yönlendirir.
  Uygulamadaki EXPO_PUBLIC_SHARE_URL bu sayfanın adresine ayarlanır.
-->
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sinefil</title>
  <meta property="og:title" content="Sinefil" />
  <meta property="og:description" content="Film ve dizileri takip et, arkadaşlarınla konuş." />
  <style>
    :root { --bg: #0b0b0d; --surface: #17171b; --text: #f2f2f4; --muted: #9a9aa3; --accent: #d9d9de; --on-accent: #0b0b0d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; width: 100%; background: var(--surface); border-radius: 20px; padding: 32px 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.5px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    a.btn { display: block; padding: 14px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
    a.alt { display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Sinefil</h1>
    <p id="msg">Uygulama açılıyor…</p>
    <a class="btn" id="open" href="#">Sinefil'de aç</a>
    <a class="alt" id="store" href="https://play.google.com/store/apps/details?id=com.frostye1.sinefil">Uygulamayı indir</a>
  </main>
  <script>
    var PACKAGE = 'com.frostye1.sinefil';
    var STORE = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
    var to = new URLSearchParams(location.search).get('to') || '';
    // Yalnızca uygulamadaki sayfalara izin ver
    if (!/^(title\/(movie|tv)\/\d+|post\/\d+|user\/[0-9a-f-]{36})$/.test(to)) to = '';
    var app = 'sinefil://' + to;
    var isAndroid = /android/i.test(navigator.userAgent);
    var link = isAndroid
      ? 'intent://' + to + '#Intent;scheme=sinefil;package=' + PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end'
      : app;
    document.getElementById('open').href = link;
    if (isAndroid) location.replace(link);
    else document.getElementById('msg').textContent = 'Bu bağlantı Sinefil uygulamasında açılır.';
  </script>
</body>
</html>
